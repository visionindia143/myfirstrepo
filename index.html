
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website | Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        header {
            background: #fff;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #0000000d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #334155;
        }

        nav a:hover {
            color: #2563eb;
        }

        .hero {
            min-height: 70vh;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 52px);
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            color: #64748b;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #fff;
            color: #64748b;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="mailto:hello@example.com">Contact</a>
        </nav>
    </header>

    <main class="hero" id="home">
        <h1>Welcome to My 23nd Website Heheh</h1>
        <p>
            A simple, modern, and responsive website
            built using HTML and CSS.
        </p>
        <a href="#about" class="btn">Get Started</a>
    </main>

    <section id="about" style="text-align:center; padding:60px 20px;">
        <h2>About Us</h2>
        <p>We create simple and beautiful web experiences.</p>
    </section>

    <footer>
        &copy; 2026 MyWebsite. All Rights Reserved.
    </footer>

</body>
</html>
